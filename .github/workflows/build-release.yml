name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            suffix: linux-amd64
          - os: ubuntu-latest
            rid: linux-arm64
            suffix: linux-arm64
          - os: macos-latest
            rid: osx-x64
            suffix: darwin-amd64
          - os: macos-latest
            rid: osx-arm64
            suffix: darwin-arm64
          - os: windows-latest
            rid: win-x64
            suffix: windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Publish
        run: dotnet publish src/RcloneEncrypt/RcloneEncrypt.csproj -c Release -r ${{ matrix.rid }} -p:Version=${{ steps.version.outputs.value }} -o publish
      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: mv publish/cli-GPT-5.6-Terra-csharp cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }} && tar czf cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }}.tar.gz cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }}
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item publish/cli-GPT-5.6-Terra-csharp.exe cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }}
          path: cli-GPT-5.6-Terra-csharp-${{ matrix.suffix }}${{ runner.os == 'Windows' && '.exe' || '.tar.gz' }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
      - name: Update package manifests
        shell: pwsh
        run: ./update-packages.ps1 -Version "${{ github.ref_name }}" -ArtifactsPath artifacts
      - name: Commit updated manifests to main
        shell: bash
        run: |
          git add cli-GPT-5.6-Terra-csharp.json Formula/cli-GPT-5.6-Terra-csharp.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update package manifests to ${{ github.ref_name }}"
          git push origin HEAD:main
